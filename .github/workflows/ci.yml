name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Catches Cache Components errors (e.g. request data outside Suspense)
      # that only show up when prerendering. The build never connects to the
      # database: every DB read happens after connection(), at request time.
      - run: npm run build
        env:
          DATABASE_URL: postgres://build:build@localhost:5432/build
